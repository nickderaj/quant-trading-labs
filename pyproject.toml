[project]
name = "quant-trading-labs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.2.2",
    "jupyter",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas",
    "polars>=1.43.0",
    "python-binance",
    "scipy>=1.17.1",
    "torch>=2.13.0",
    "tqdm>=4.69.1",
    "vegafusion[embed]>=2.0.3",
    "vl-convert-python>=1.9.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "scipy-stubs>=1.17.1.5",
    "types-tqdm>=4.69.0.20260724",
]
